quant_stage:
  quant_modifiers:

    AutoRoundModifier:
      ignore: ["re:lm_head", "re:.*visual.*"]
      iters: 200
      enable_torch_compile: false

      config_groups:
        group_0:
          weights:
            num_bits: 4
            type: int
            symmetric: true
            strategy: channel
          input_activations:
          output_activations:
          targets: [
                        "re:.*up_proj$",
                        "re:.*gate_proj$",
                        "re:.*q_proj$",
                        "re:.*k_proj$",
                        "re:.*v_proj$",
                        "re:.*o_proj$",
                        "re:.*out_proj$",
                        "re:.*attn.proj$",
                        "re:.*down_proj$"
                    ]
