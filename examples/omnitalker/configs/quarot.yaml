quant_stage:
  quant_modifiers:
    SpinQuantModifier:
      rotations: ["R1", "R2"]
      transform_block_size_R1: 1024
      learnable: True
      transform_type: "random-hadamard"
    # SmoothQuantModifier:
    #   smoothing_strength: 0.8
    QuantizationModifier:
      ignore: ["re:lm_head", "re:visual.*", "re:model.visual.*", "re:audio_tower.*"]

      config_groups:
        group_0:
          weights:
            num_bits: 4
            type: int
            symmetric: true
            strategy: channel
          # input_activations: {num_bits: 8, type: int, symmetric: true, strategy: token, dynamic: true}
          targets: [Linear]
